<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Цифра Софт</title>
    <script>
        // Проверяем активную сессию при загрузке
        (function() {
            const TOKEN_KEY = "cifra_soft_token";
            const USER_KEY = "cifra_soft_user";
            
            // Проверяем localStorage
            let token = localStorage.getItem(TOKEN_KEY);
            let user = localStorage.getItem(USER_KEY);
            
            // Если нет в localStorage, проверяем sessionStorage
            if (!token || !user) {
                token = sessionStorage.getItem(TOKEN_KEY);
                user = sessionStorage.getItem(USER_KEY);
            }
            
            // Если есть активная сессия - на дашборд, иначе на логин
            if (token && user) {
                window.location.replace("dashboard.html");
            } else {
                window.location.replace("login.html");
            }
        })();
    </script>
</head>
<body>
    <p>Перенаправление...</p>
</body>
</html>
