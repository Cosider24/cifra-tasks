<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Цифра Софт</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .login-form { max-width: 400px; margin: 0 auto; }
        .login-form label { display: block; margin-bottom: 6px; font-weight: 600; }
        .login-form input {
            width: 100%; padding: 10px 12px; border-radius: var(--radius);
            border: 1px solid #cfd4dc; margin-bottom: 14px;
        }
        .login-error { color: #c62828; margin-bottom: 12px; font-size: 14px; }
        .hidden { display: none; }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .remember-row input {
            width: auto;
            margin-bottom: 0;
        }
        .remember-row label {
            margin-bottom: 0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <main class="login-wrap">
        <section class="card login-form">
            <h1 style="text-align:center;margin-top:0">Цифра Софт</h1>
            <p class="muted" style="text-align:center">Вход в систему задач</p>
            <div id="loginError" class="login-error hidden"></div>
            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="email@example.com" autocomplete="username" required />
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required />
                <div class="remember-row">
                    <input type="checkbox" id="rememberMe" />
                    <label for="rememberMe">Запомнить меня</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Войти</button>
            </form>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
        (async function () {
            // Проверяем, есть ли уже активная сессия
            const TOKEN_KEY = "cifra_soft_token";
            const USER_KEY = "cifra_soft_user";
            
            let token = localStorage.getItem(TOKEN_KEY);
            let user = localStorage.getItem(USER_KEY);
            
            if (!token || !user) {
                token = sessionStorage.getItem(TOKEN_KEY);
                user = sessionStorage.getItem(USER_KEY);
            }
            
            if (token && user) {
                // Проверяем валидность токена
                try {
                    const res = await fetch("https://cifra-tasks.onrender.com/api/api/auth/me", {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        window.location.href = "dashboard.html";
                        return;
                    }
                } catch(e) {
                    // Токен невалидный, чистим
                    localStorage.removeItem(TOKEN_KEY);
                    localStorage.removeItem(USER_KEY);
                    sessionStorage.removeItem(TOKEN_KEY);
                    sessionStorage.removeItem(USER_KEY);
                }
            }
            
            // Восстанавливаем последний email если есть
            const lastEmail = localStorage.getItem("last_user_email");
            if (lastEmail) {
                document.getElementById("email").value = lastEmail;
                document.getElementById("password").focus();
            }
            
            const form = document.getElementById("loginForm");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const rememberCheckbox = document.getElementById("rememberMe");
            const errorDiv = document.getElementById("loginError");
            
            // Если пользователь уже вводил email и ставил галочку "Запомнить меня" ранее
            const lastRemember = localStorage.getItem("last_remember_me");
            if (lastRemember === "true") {
                rememberCheckbox.checked = true;
            }
            
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorDiv.classList.add("hidden");
                errorDiv.textContent = "";
                
                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;
                const rememberMe = rememberCheckbox.checked;
                
                if (!email || !password) {
                    errorDiv.textContent = "Заполните email и пароль";
                    errorDiv.classList.remove("hidden");
                    return;
                }
                
                try {
                    const res = await fetch("https://cifra-tasks.onrender.com/api/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password }),
                    });
                    const data = await res.json();
                    
                    if (!res.ok || !data.success) {
                        throw new Error(data.message || "Ошибка входа");
                    }
                    
                    // Сохраняем последний email (всегда, независимо от чекбокса)
                    localStorage.setItem("last_user_email", email);
                    localStorage.setItem("last_remember_me", rememberMe);
                    
                    // Сохраняем токен и данные пользователя
                    if (rememberMe) {
                        localStorage.setItem("cifra_soft_token", data.token);
                        localStorage.setItem("cifra_soft_user", JSON.stringify(data.user));
                        // Чистим sessionStorage если там что-то было
                        sessionStorage.removeItem("cifra_soft_token");
                        sessionStorage.removeItem("cifra_soft_user");
                    } else {
                        sessionStorage.setItem("cifra_soft_token", data.token);
                        sessionStorage.setItem("cifra_soft_user", JSON.stringify(data.user));
                        // Чистим localStorage если там что-то было
                        localStorage.removeItem("cifra_soft_token");
                        localStorage.removeItem("cifra_soft_user");
                    }
                    
                    window.location.href = "dashboard.html";
                } catch (err) {
                    errorDiv.textContent = err.message || "Ошибка входа";
                    errorDiv.classList.remove("hidden");
                }
            });
        })();
    </script>
</body>
</html>
